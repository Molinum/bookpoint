server:
  port: 8084

spring:
  application:
    name: bookpoint-ms-clientes
  datasource:
    url: jdbc:mysql://localhost:3306/bookpoint_clientes_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: root
    password: password
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

springdoc:
  api-docs:
    path: /api/v1/clientes/v3/api-docs

app:
  jwt:
    secret: "bookpoint-clientes-jwt-secreto-de-desarrollo-cambiar-en-produccion-2026"
    expiration-ms: 3600000

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${server.port}